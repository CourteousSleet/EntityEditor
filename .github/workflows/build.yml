name: Build and test
on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          SqlLocalDB start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: dotnet restore EntityEditor.sln --locked-mode
      - run: dotnet build EntityEditor.sln --no-restore --configuration Release
      - run: dotnet test EntityEditor.sln --no-build --configuration Release
      - run: dotnet list EntityEditor.sln package --vulnerable --include-transitive
